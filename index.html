<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shahi</title>
    <style>
      .loading {
        background: #030712;
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loading img {
        width: 60%;
        object-fit: cover;
        animation: loading-pulse 1500ms ease-in-out infinite;
      }
      @keyframes loading-pulse {
        50% {
          opacity: 0.5;
        }
      }
      @media (width >= 80rem /* 1280px */) {
        .loading img {
          width: 20%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading sm">
        <img src="./src/assets/logo/shahimovie.svg" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
